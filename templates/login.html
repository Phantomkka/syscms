{% extends 'base.html' %}
{% block title %}Вход — SysCMS{% endblock %}

{% block content %}
<style>
    .login-card { background: #fff; border-radius: 8px; padding: 40px; box-shadow: 0 4px 16px rgba(0,0,0,.1); }
    .login-card h2 { text-align: center; margin-bottom: 24px; font-size: 22px; }
    .login-card .form-group { margin-bottom: 16px; }
    .login-card .form-group input { font-size: 16px; padding: 10px 12px; }
    .login-card .btn { width: 100%; padding: 12px; font-size: 16px; }
</style>

<div class="login-wrap">
    <div class="login-card">
        <h2>🔐 Вход в SysCMS</h2>
        <form method="POST">
            <div class="form-group">
                <label>Логин</label>
                <input type="text" name="username" required autofocus>
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-primary">Войти</button>
        </form>
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% for cat, msg in messages %}
        <div class="alert alert-{{ cat }}" style="margin-top:12px">{{ msg }}</div>
        {% endfor %}
        {% endwith %}
    </div>
</div>
{% endblock %}
