<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}SysCMS{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

{% if session.get('user') %}
<nav class="navbar">
    <a href="{{ url_for('index') }}" class="{% if request.endpoint == 'index' %}active{% endif %}">📊 Главная</a>
    <a href="{{ url_for('companies') }}" class="{% if request.endpoint == 'companies' %}active{% endif %}">🏢 Компании</a>
    <a href="{{ url_for('pcs') }}" class="{% if request.endpoint == 'pcs' %}active{% endif %}">🖥 ПК</a>
    <a href="{{ url_for('sysadmins_list') }}" class="{% if 'sysadmin' in request.endpoint %}active{% endif %}">👨‍💼 Сисадмины</a>
    <span class="spacer"></span>
    <a href="https://zabbix.example.com" class="btn-external" target="_blank">📋 Заявки</a>
    <a href="https://zabbix.example.com" class="btn-external" target="_blank">🔴 Забикс</a>
    <a href="{{ url_for('logout') }}" style="color:#e94560">🚪 Выход</a>
</nav>
{% endif %}

<div class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
    <div class="alert alert-{{ cat }}">{{ msg }}</div>
    {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}
</div>

</body>
</html>
